[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "finsight"
version = "0.1.0"
description = "Self-serve market data platform: fetch validated, query-ready financial datasets reproducibly."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yaseen Sadat" }]
keywords = ["market-data", "finance", "ohlcv", "data-engineering", "duckdb", "parquet", "airflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1",
    "fsspec>=2024.6",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]
ui = ["streamlit>=1.38"]
spark = ["pyspark>=4.0"]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
all = ["finsight[s3,ui,snowflake]"]
dev = [
    "finsight[s3,ui,snowflake]",
    "lxml>=5.0",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
finsight = "finsight.cli:main"

[project.urls]
Homepage = "https://github.com/YaseenSadat/FinSight"
Documentation = "https://github.com/YaseenSadat/FinSight/tree/main/docs"
Issues = "https://github.com/YaseenSadat/FinSight/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.hatch.build.targets.sdist]
include = ["src/finsight", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PTH", "RET"]
ignore = ["B008"]  # typer declares CLI options as call defaults

[tool.ruff.lint.isort]
known-first-party = ["finsight"]

[tool.mypy]
python_version = "3.12"  # numpy stubs use 3.12 syntax; runtime still supports 3.11
files = ["src/finsight"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: talks to a live data provider (deselect with -m 'not network')",
    "spark: requires pyspark and a compatible Java runtime",
]
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]

[tool.coverage.run]
source = ["finsight"]
omit = ["src/finsight/ui/*", "src/finsight/engines/spark.py"]
